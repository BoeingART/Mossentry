name: Desktop release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm run check:ci
      - run: npm run check:rust
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run test:ssh
      - name: Exercise account operations in a disposable Linux container
        run: docker run --rm -v "$PWD:/source:ro" ubuntu:22.04 bash -c 'apt-get update -qq && apt-get install -y -qq python3 sudo passwd && python3 /source/scripts/test-remote-linux.py'

  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            name: mac-x64
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-2022
            name: windows-x64
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check macOS release signing prerequisites
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.APPLE_NOTARIZATION == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/release.cjs check-macos-signing
      - name: Configure Perl for bundled OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $perl)) { throw 'Strawberry Perl was not installed at the expected path.' }
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $perl -v
      - run: npm ci
      - run: npm run build && npm run test:monitor && npm run test:rust
      - name: Build native installers and signed updater packages
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v') || vars.APPLE_NOTARIZATION != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo 'Configure TAURI_SIGNING_PRIVATE_KEY before publishing an auto-update release.' >&2
              exit 1
            fi
            npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json -- --locked
          else
            npm run tauri -- build --bundles ${{ matrix.bundles }} -- --locked
          fi
      - name: Build Developer ID signed and notarized macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.APPLE_NOTARIZATION == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY before publishing an auto-update release.' >&2
            exit 1
          fi
          npm run tauri -- build --bundles app,dmg --config src-tauri/tauri.release.conf.json -- --locked
      - name: Verify Apple trust for the app, DMG and updater archive
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && vars.APPLE_NOTARIZATION == 'true'
        shell: bash
        run: bash scripts/verify-macos-release.sh
      - name: Smoke test packaged application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            src-tauri/target/release/bundle/macos/Mossentry.app/Contents/MacOS/mossentry --smoke-test
          else
            src-tauri/target/release/mossentry.exe --smoke-test
          fi
      - name: Stage platform-specific release assets
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release.cjs stage ${{ matrix.platform }} --signed
          else
            node scripts/release.cjs stage ${{ matrix.platform }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release-stage/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check all package versions match the release tag
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          versions = [json.loads(Path('package.json').read_text())['version'],
                      json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'],
                      tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']]
          assert all('v' + version == os.environ['GITHUB_REF_NAME'] for version in versions)
          PY
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the complete updater manifest
        run: node scripts/release.cjs manifest
      - name: Publish installers, signed updates and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.dmg *.exe *.tar.gz *.sig latest.json > SHA256SUMS.txt
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.dmg *.exe *.tar.gz *.sig latest.json SHA256SUMS.txt ../docs/INSTALL.md --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file ../docs/RELEASE.md "${release_flags[@]}"
