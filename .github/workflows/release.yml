name: Desktop release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm run check
      - run: npm run check:rust
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run test:ssh
      - name: Exercise account operations in a disposable Linux container
        run: docker run --rm -v "$PWD:/source:ro" ubuntu:22.04 bash -c 'apt-get update -qq && apt-get install -y -qq python3 sudo passwd && python3 /source/scripts/test-remote-linux.py'

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac-arm64
            bundles: app,dmg
          - os: macos-15-intel
            name: mac-x64
            bundles: app,dmg
          - os: windows-2022
            name: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Configure Perl for bundled OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: npm ci
      - run: npm run build && npm run test:monitor && npm run test:rust
      - run: npm run tauri -- build --locked --bundles ${{ matrix.bundles }}
      - name: Smoke test packaged application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            src-tauri/target/release/bundle/macos/Mossentry.app/Contents/MacOS/mossentry --smoke-test
          else
            src-tauri/target/release/mossentry.exe --smoke-test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check all package versions match the release tag
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          versions = [json.loads(Path('package.json').read_text())['version'],
                      json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'],
                      tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']]
          assert all('v' + version == os.environ['GITHUB_REF_NAME'] for version in versions)
          PY
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} . \;
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.dmg *.exe SHA256SUMS.txt docs/INSTALL.md --repo "$GITHUB_REPOSITORY" --verify-tag --title "Mossentry $GITHUB_REF_NAME" --notes-file docs/DEV-RUST.md
