---
- name: Agentless maintenance using existing Linux tools
  hosts: managed
  gather_facts: false
  become: "{{ operation_become | bool }}"
  tasks:
    - name: Run fixed operation in memory
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - "{{ lookup('ansible.builtin.file', '../app/operations_probe.py') }}"
        stdin: "{{ operation_payload | to_json }}"
      register: operation_result
      changed_when: operation_payload.operation in ['start', 'stop', 'restart', 'enable', 'disable']
      no_log: true
    - name: Save bounded result locally
      ansible.builtin.copy:
        dest: "{{ operation_output_dir }}/{{ inventory_hostname }}.json"
        content: "{{ operation_result.stdout }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
      vars:
        ansible_remote_tmp: "{{ operation_output_dir }}/.ansible-tmp"
