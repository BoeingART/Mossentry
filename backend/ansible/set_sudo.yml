---
- name: Change sudo membership
  hosts: managed
  gather_facts: false
  become: true
  tasks:
    - name: Validate requested username
      ansible.builtin.assert:
        that: managed_username is match('^[a-z_][a-z0-9_-]{0,31}$')

    - name: Verify the user already exists
      ansible.builtin.command: "getent passwd {{ managed_username }}"
      changed_when: false

    - name: Select the platform sudo group
      ansible.builtin.shell: "getent group sudo >/dev/null && echo sudo || echo wheel"
      register: sudo_group
      changed_when: false

    - name: Grant sudo membership
      ansible.builtin.user:
        name: "{{ managed_username }}"
        groups: "{{ sudo_group.stdout }}"
        append: true
      when: managed_sudo | bool

    - name: Remove sudo membership
      ansible.builtin.command: "gpasswd -d {{ managed_username }} {{ sudo_group.stdout }}"
      register: remove_sudo
      changed_when: remove_sudo.rc == 0
      failed_when: remove_sudo.rc not in [0, 3]
      when: not (managed_sudo | bool)

    - name: Verify the resulting administrative sudo privilege
      ansible.builtin.command:
        argv:
          - sudo
          - -l
          - -U
          - "{{ managed_username }}"
          - /bin/sh
      register: administrative_sudo
      changed_when: false
      failed_when: >-
        (managed_sudo | bool and administrative_sudo.rc != 0) or
        (not (managed_sudo | bool) and administrative_sudo.rc == 0)
