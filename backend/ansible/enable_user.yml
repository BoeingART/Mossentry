---
- name: Enable a managed user's login
  hosts: managed
  gather_facts: false
  become: true
  tasks:
    - name: Validate requested username
      ansible.builtin.assert:
        that: managed_username is match('^[a-z_][a-z0-9_-]{0,31}$')

    - name: Verify the user already exists
      ansible.builtin.command: "getent passwd {{ managed_username }}"
      changed_when: false

    - name: Read the current password state
      ansible.builtin.command: "getent shadow {{ managed_username }}"
      register: managed_shadow
      changed_when: false
      no_log: true

    - name: Restore interactive shell
      ansible.builtin.user:
        name: "{{ managed_username }}"
        shell: /bin/bash

    - name: Unlock an existing password hash
      ansible.builtin.user:
        name: "{{ managed_username }}"
        password_lock: false
      when:
        - managed_shadow.stdout.split(':')[1].startswith('!')
        - managed_shadow.stdout.split(':')[1] | length > 2
