---
- name: Read user and privilege state
  hosts: managed
  gather_facts: false
  tasks:
    - name: Read passwd database
      ansible.builtin.command: getent passwd
      register: passwd_result
      changed_when: false

    - name: Read sudo group
      ansible.builtin.shell: getent group sudo || true
      register: sudo_result
      changed_when: false

    - name: Read wheel group
      ansible.builtin.shell: getent group wheel || true
      register: wheel_result
      changed_when: false

    - name: Identify accounts with administrative sudo privilege
      become: true
      ansible.builtin.shell: |
        getent passwd | awk -F: '{print $1}' |
        while read -r account; do
          if sudo -l -U "$account" /bin/sh >/dev/null 2>&1; then
            echo "$account"
          fi
        done
      register: effective_sudo_result
      changed_when: false

    - name: Read account creation timestamps from logs or home directories
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/user_creation_times.py') }}"
        stdin: "{{ passwd_result.stdout }}"
      register: creation_result
      changed_when: false
      failed_when: false

    - name: Save scan result on control server
      ansible.builtin.copy:
        dest: "{{ scan_output_dir }}/{{ inventory_hostname }}.json"
        mode: "0600"
        content: >-
          {{ {'passwd': passwd_result.stdout,
              'sudo': sudo_result.stdout,
              'wheel': wheel_result.stdout,
              'effective_sudo': effective_sudo_result.stdout,
              'creation_times': (creation_result.stdout | from_json)
                if creation_result.rc | default(1) == 0 else {}} | to_json }}
      delegate_to: localhost
      vars:
        ansible_remote_tmp: "{{ scan_output_dir }}/.ansible-tmp"
